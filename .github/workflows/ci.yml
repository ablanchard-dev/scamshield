name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov
      - name: Run pytest + coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest --maxfail=1 --disable-warnings -q --cov=scamshield --cov-report=xml --cov-report=html
      - name: Data -> train -> eval pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python get_data.py
          python train_calibrate.py --data data/sms_spam.csv --text-col text --label-col label
          python make_dataset.py
          python eval.py
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/**

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t scamshield:ci .
      - name: Scorer works inside the image
        # Un data/ manquant ne leve pas d'erreur : les listes tombent a vide et tout
        # devient SUR. On verifie donc le verdict, pas seulement que le build passe.
        run: |
          out=$(docker run --rm scamshield:ci python -m scamshield.scorer \
            --text "Votre colis est retenu, payez 2,99 EUR : http://parcel-fr.cc/pay")
          echo "$out"
          echo "$out" | grep -q "DOUTEUX" || { echo "FAIL: expected DOUTEUX (data/ missing from image?)"; exit 1; }
      - name: Web demo answers on 8501
        run: |
          docker run -d --rm -p 8501:8501 --name scamshield-ci scamshield:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8501/_stcore/health >/dev/null && break || sleep 2
          done
          curl -sf http://localhost:8501/_stcore/health
          docker stop scamshield-ci
